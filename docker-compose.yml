services:
  db:
    image: postgres:16-alpine
    container_name: simple-invoice-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-simple_invoice}
    ports:
      # Host 5433 -> container 5432 (avoids clashing with a local Postgres).
      - '${DB_PUBLISH_PORT:-5433}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-simple_invoice}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: simple-invoice-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-simple_invoice}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-admin@101digital.io}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-Password123!}
      SEED_USER_FULLNAME: ${SEED_USER_FULLNAME:-Reviewer Admin}
      # Seed sample data on first boot (skips if the DB already has invoices).
      RUN_SEED_ON_BOOT: ${RUN_SEED_ON_BOOT:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}
    ports:
      - '${BACKEND_PUBLISH_PORT:-3000}:3000'

  frontend:
    build:
      context: ./frontend
      args:
        # Browser runs on the host, so it reaches the backend via the host port.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    container_name: simple-invoice-frontend
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PUBLISH_PORT:-8080}:80'

volumes:
  db_data:
